name: Build Madrasti AI Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 🚀 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🔍 TypeScript type check
        run: pnpm check

      - name: 🧪 Run tests
        run: pnpm test

      - name: 📱 Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Standalone Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon
          cd ..
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk madrasti-ai.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk madrasti-ai.apk
          fi

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: madrasti-ai-apk
          path: madrasti-ai.apk
          retention-days: 30

      - name: 🏷️ Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: 'Madrasti AI v1.0.0 (Android APK)'
          body: |
            ## 🇲🇦 تحميل تطبيق مدرستي للذكاء الاصطناعي (Madrasti AI APK)
            تطبيق تعليمي مغربي مجاني 100% يعمل بدون إنترنت مع أستاذ ذكي (معلم) لجميع المستويات من الأولى إعدادي إلى الثانية بكالوريا.

            ### 📥 خطوات التثبيت:
            1. حمل ملف **`madrasti-ai.apk`** المرفق أسفله مباشرة على هاتفك.
            2. افتح الملف واضغط على **تثبيت (Installer)**.
            3. إذا ظهر لك تنبيه أمان، اضغط على **السماح بالتثبيت من هذا المصدر**.
            4. افتح التطبيق واختر **"متابعة كزائر في الوضع المستقل (بدون إنترنت)"** وابدأ الدراسة مجاناً وبكل حرية!
          files: madrasti-ai.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
